# Avisos por Telegram con la previsión de pesca, dos veces al día en hora española:
#   11:31 -> antes de empezar a comprar por WhatsApp (desde las 12:30)
#   19:46 -> previsión actualizada antes del cierre de WhatsApp (21:00) y del Merca (4:30)
# GitHub programa en hora UTC: cada aviso tiene una línea para invierno y otra para verano,
# y robot/aviso.js solo envía la que corresponde ese día. GitHub puede retrasar unos minutos.
# También se puede lanzar a mano desde la pestaña "Actions" (envía un aviso de prueba).
name: Aviso diario Telegram

on:
  schedule:
    - cron: "31 10 * * *"   # mediodía, invierno
    - cron: "31 9 * * *"    # mediodía, verano
    - cron: "46 18 * * *"   # tarde, invierno
    - cron: "46 17 * * *"   # tarde, verano
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enviar aviso
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROGRAMACION: ${{ github.event.schedule }}
        run: node robot/aviso.js
